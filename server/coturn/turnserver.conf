# coturn — TURN for the site's WebRTC (games, calls) when two players can't connect directly (strict mobile NAT). docs/SERVER.md
# Only coturn 4.18 options (an unknown option stops coturn). The secret and the addresses are appended at start from .env
# (docker-compose.yml: static-auth-secret, external-ip, listening-ip, relay-ip) — they are not in this file.
listening-port=3478
min-port=49160
max-port=49200
fingerprint
use-auth-secret
realm=d37
no-tls
no-cli
no-tcp-relay
no-multicast-peers
no-rfc5780
stale-nonce=600

# limits: allocations per user and total, bytes per second per session and for the whole server (Minecraft keeps its share)
user-quota=12
total-quota=300
max-bps=96000
bps-capacity=6000000

# logs: errors only, to docker (no visitor addresses in the log)
log-file=stdout
log-min-level=error
pidfile=/tmp/turnserver.pid

# never relay into private, loopback, link-local (169.254.169.254 — cloud metadata), CGNAT, documentation, benchmark and
# multicast ranges, IPv4 and IPv6 (coturn takes IP-IP ranges, not CIDR; a malformed line stops coturn — on purpose)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
