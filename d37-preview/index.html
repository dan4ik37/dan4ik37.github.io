<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<base href="/d37-preview/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>D37</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #e8eef5; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .btn { position: fixed; width: 60px; height: 60px; border-radius: 50%; display: none; align-items: center; justify-content: center; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); font-size: 26px; user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; }
  #jump { right: 18px; bottom: 64px; }
  #orbit { right: 18px; bottom: 136px; }
  #crouch { right: 18px; bottom: 208px; }
  #fly { right: 18px; bottom: 280px; }
  .btn.on { background: rgba(255, 160, 60, .55); }
  #full { right: 10px; top: 10px; width: 40px; height: 40px; font-size: 18px; display: flex; border-radius: 8px; }
  #hud { position: fixed; left: 8px; top: 8px; padding: 6px 9px; background: rgba(0, 0, 0, .55); border-radius: 6px; white-space: pre; font: 12px/1.35 ui-monospace, Consolas, monospace; pointer-events: none; display: none; }
  #hint { position: fixed; left: 50%; bottom: 10px; width: max-content; max-width: 94vw; box-sizing: border-box; transform: translateX(-50%); padding: 5px 10px; background: rgba(0, 0, 0, .5); border-radius: 6px; pointer-events: none; font-size: 12px; line-height: 1.3; text-align: center; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #05070b; }
  #gear { right: 58px; top: 10px; width: 40px; height: 40px; font-size: 18px; display: flex; border-radius: 8px; }
  #admin { position: fixed; left: 8px; top: 8px; bottom: 8px; width: min(420px, 92vw); overflow-y: auto; display: none; padding: 8px 10px; background: rgba(8, 10, 14, .88); border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; z-index: 5; }
  #admin .atitle { font-weight: 600; margin-bottom: 4px; color: #ffd36b; }
  #admin .agroup { margin: 8px 0 3px; font-size: 12px; text-transform: uppercase; opacity: .75; }
  #admin .arow { display: flex; flex-wrap: wrap; gap: 5px; }
  #admin button { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .1); color: inherit; cursor: pointer; touch-action: manipulation; }
  #admin button:active { background: rgba(255, 160, 60, .5); }
  #admin .astatus { margin-top: 8px; font-size: 12px; color: #9f9; white-space: pre-wrap; }
  #wardrobe { position: fixed; right: 8px; top: 8px; max-height: calc(100% - 16px); width: min(380px, 70vw); overflow-y: auto; display: none; padding: 8px 10px; background: rgba(8, 10, 14, .85); border: 1px solid rgba(255, 255, 255, .15); border-radius: 8px; color: #eee; font: 14px system-ui, sans-serif; z-index: 20; }
  #wardrobe .atitle { font-weight: 600; margin-bottom: 4px; color: #ffd36b; }
  #wardrobe .agroup { margin: 8px 0 3px; font-size: 12px; text-transform: uppercase; opacity: .75; }
  #wardrobe .arow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  #wardrobe button { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .1); color: inherit; }
  #wardrobe button.on { background: rgba(255, 160, 60, .55); }
  #wardrobe button.sw { width: 30px; height: 30px; padding: 0; }
  #wardrobe button.sw.on { outline: 2px solid #fff; }
  #wardrobe input[type=range] { width: 100%; }
  #wardrobe .astatus { margin-top: 8px; font-size: 12px; color: #9f9; }
  /* a phone: the panel takes the lower part of the screen, the face (screen middle, upper half) stays clear */
  @media (max-width: 700px) { #wardrobe { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 42%; } }

  #tree-workshop { position: fixed; z-index: 6; top: 64px; right: 20px; width: min(320px, 88vw); max-height: calc(100dvh - 86px); overflow: auto; padding: 16px; box-sizing: border-box; background: #172019f5; color: #e7eee6; border: 1px solid #4d6251; border-radius: 14px; box-shadow: 0 12px 36px #10130baa; }
  #tree-workshop summary { cursor: pointer; font-size: 17px; font-weight: 650; }
  #tree-workshop form { display: grid; gap: 11px; margin-top: 14px; }
  #tree-workshop label { display: grid; gap: 4px; color: #ccd8cc; min-width: 0; }
  #tree-workshop .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #tree-workshop input, #tree-workshop select, #tree-workshop button, #tree-workshop .load { box-sizing: border-box; min-height: 36px; width: 100%; border-radius: 7px; border: 1px solid #56695a; background: #223026; color: #edf3eb; font: inherit; padding: 5px 8px; }
  #tree-workshop .lod { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #tree-workshop button, #tree-workshop .load { cursor: pointer; text-align: center; }
  #tree-workshop [aria-pressed="true"], #tree-workshop button[type="submit"] { background: #bcdb9c; border-color: #bcdb9c; color: #192413; font-weight: 650; }
  #tree-workshop .load { display: grid; place-items: center; position: relative; }
  #tree-workshop .load input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #tree-workshop .load:focus-within { outline: 2px solid #bcdb9c; }
  #tree-workshop output { min-height: 1.4em; color: #bdceba; overflow-wrap: anywhere; }
  @media (max-width: 700px) {
    #tree-workshop { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 48dvh; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">загрузка…</div>
<div id="hint">Осмотреться: нажми на картинку или зажми кнопку мыши и веди</div>
<div id="orbit" class="btn" title="орбита ↔ земля">🌍</div>
<div id="jump" class="btn" title="прыжок">⤒</div>
<div id="crouch" class="btn" title="присесть / слезть">⤓</div>
<div id="fly" class="btn" title="полёт">🕊</div>
<div id="full" class="btn" title="на весь экран">⛶</div>
<div id="gear" class="btn" title="меню админа">⚙</div>
<div id="admin"></div>
<div id="wardrobe"></div>

<details id="tree-workshop" open hidden>
  <summary>Мастерская деревьев</summary>
  <form>
    <label>Вид дерева
      <select name="species">
        <option value="tree_broad" data-size="12 0.32">Лиственное</option>
        <option value="tree_pine" data-size="16 0.32" selected>Сосна</option>
        <option value="biomes_spruce" data-size="14 0.25">Ель</option>
        <option value="biomes_birch" data-size="12 0.18">Берёза</option>
        <option value="biomes_palm" data-size="9 0.2">Пальма</option>
        <option value="biomes_swamp_tree" data-size="10 0.3">Болотное дерево</option>
        <option value="zones_gloom_tree" data-size="10 0.25">Чёрное дерево</option>
        <option value="zones_jungle_tree" data-size="24 0.5">Дерево джунглей</option>
        <option value="zones_bamboo" data-size="9 0.08">Бамбук</option>
        <option value="zones_amber_tree" data-size="10 0.25">Янтарное дерево</option>
        <option value="zones_giant_mushroom" data-size="7 0.35">Гигантский гриб</option>
        <option value="zones_dead_snag" data-size="6 0.16">Сухостой</option>
        <option value="forests_giant" data-size="95 4">Дерево-великан</option>
        <option value="tree_flat" data-size="11 0.3">Зонтичное дерево</option>
        <option value="bush" data-size="1.3 0.03">Куст</option>
      </select>
    </label>
    <div class="fields">
      <label>Высота, м<input type="number" name="height" value="16" min="1" max="150" step="0.1" required></label>
      <label>Радиус ствола, м<input type="number" name="radius" value="0.32" min="0.03" max="10" step="0.01" required></label>
      <label>Ширина кроны ×<input type="number" name="crown" value="1" min="0.55" max="1.6" step="0.01" required></label>
      <label>Seed<input type="number" name="seed" value="37" min="0" max="4294967295" step="1" required></label>
    </div>
    <div class="lod" role="group" aria-label="Уровень детализации">
      <button type="button" data-level="0" aria-pressed="true" title="Подробное дерево">LOD 0</button>
      <button type="button" data-level="1" aria-pressed="false" title="Упрощённая геометрия">LOD 1</button>
      <button type="button" data-level="2" aria-pressed="false" title="Дальний силуэт">LOD 2</button>
    </div>
    <div class="fields">
      <button type="submit">Обновить дерево</button>
      <button type="button" data-seed>Случайный seed</button>
      <button type="button" data-save>Скачать пресет</button>
      <label class="load">Загрузить пресет<input type="file" name="preset" accept=".json,application/json"></label>
    </div>
    <output aria-live="polite"></output>
  </form>
</details>
<div id="error"></div>
<script type="module" src="./d37-page.js"></script>
</body>
</html>
