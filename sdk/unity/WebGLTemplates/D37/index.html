<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
<title>{{{ PRODUCT_NAME }}}</title>
<!-- Шаблон «D37» из SDK Денчика: игра на всё окно (на сайте её показывают в окошке нужной формы), полоса загрузки,
     понятная ошибка. Сделан по образцу Minimal-шаблона Unity. Выбрать: Player Settings → Resolution and Presentation →
     WebGL Template → D37 (меню «SDK Денчика → Настроить сборку для сайта» делает это само). -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #000; }
  #d37-load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #fff; font: 600 15px/1.4 "Segoe UI", Roboto, Arial, sans-serif; background: #0d0b1a; text-align: center; padding: 20px; box-sizing: border-box; }
  #d37-load b { font-size: 20px; }
  #d37-load .bar { width: min(320px, 80vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
  #d37-load .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #9b6dff, #ff6fb5); transition: width .2s; }
  #d37-load small { color: #a9a3c9; }
  #d37-load.err .bar { display: none; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="d37-load"><b>{{{ PRODUCT_NAME }}}</b><div class="bar"><i id="d37-bar"></i></div><small id="d37-st">Загружаем игру…</small></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
  var canvas = document.getElementById('unity-canvas');
  var box = document.getElementById('d37-load'), bar = document.getElementById('d37-bar'), st = document.getElementById('d37-st');
  function fail(e) {
    box.className = 'err';
    st.textContent = 'Игра не загрузилась: ' + (e && e.message ? e.message : e) + '. Обнови страницу. Автору: проверь сжатие (Decompression Fallback).';
  }
  if (typeof createUnityInstance !== 'function') fail('нет файла Build/{{{ LOADER_FILENAME }}}');
  else createUnityInstance(canvas, {
    dataUrl: 'Build/{{{ DATA_FILENAME }}}',
    frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
    workerUrl: 'Build/{{{ WORKER_FILENAME }}}',
#endif
    codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
    memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
    streamingAssetsUrl: 'StreamingAssets',
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (msg, type) { if (type === 'error') fail(msg); else console.warn(msg); }
  }, function (p) {
    bar.style.width = Math.round(p * 100) + '%';
    if (p >= 1) st.textContent = 'Запускаем…';
  }).then(function () {
    box.remove();
    canvas.focus();
  }).catch(fail);
</script>
</body>
</html>
